# client/nginx.conf
#
# Two responsibilities:
#   1. Serve the React SPA at /, with history-mode fallback so deep
#      URLs like /teams/abc work on direct navigation
#   2. Reverse-proxy /api/* to the server container on the
#      synergy-net Docker network
#
# The Express server inside the network is reachable as `server:3000`
# (the service name in docker-compose.yml). The browser only ever
# talks to localhost:8080, which eliminates CORS entirely.

server {
    listen 80;
    server_name _;

    # Static assets (JS bundles, CSS, images) served from /usr/share/nginx/html
    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed assets (Vite adds content hashes by default)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse proxy: anything under /api/ goes to the server container.
    # The server's Express routes are NOT prefixed with /api (they live
    # at /auth, /teams, etc.), so we strip the /api prefix before
    # forwarding via rewrite.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow longer reads for chat polling endpoints
        proxy_read_timeout 60s;
    }

    # SPA fallback: any unknown path falls back to index.html so
    # React Router can handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable Nginx version disclosure
    server_tokens off;
}
